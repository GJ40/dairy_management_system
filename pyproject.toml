[project]
name = "backend-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GJ40", email = "gaurangjadhavhellogic@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.17",
    "bcrypt>=5.0.0",
    "faker>=40.43.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "pyjwt>=2.15.1",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
